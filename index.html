<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="./favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地球自转与公转 3D 互动课件</title>
  <style>
    html, body, #app { margin: 0; width: 100%; height: 100%; background: #0d1016; }
    .boot-loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px; color: #eceae6; text-align: center; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: radial-gradient(ellipse at 50% 40%, #1e222a, #0d1016 70%); }
    .boot-loading svg { width: 96px; height: 96px; margin-bottom: 4px; }
    .boot-loading strong { font-size: 20px; font-weight: 600; }
    .boot-loading p { margin: 0; color: #b6bfc9; font-size: 14px; }
  </style>
</head>

<body>
  <div id="app">
    <div class="boot-loading" role="status" aria-live="polite">
      <svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="35" fill="none" stroke="#a7b8c42e"/><circle cx="48" cy="48" r="13" fill="#dfc79e"/><circle cx="48" cy="13" r="5" fill="#b5cfdf"/></svg>
      <strong>地球自转与公转</strong>
      <p>正在启动课件…</p>
      <noscript>请启用 JavaScript 后重新打开课件。</noscript>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
